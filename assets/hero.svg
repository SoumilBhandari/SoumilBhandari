<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-label="Soumil Bhandari">
<title>Soumil Bhandari</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }

.name { font-size: 112px; font-weight: 800; letter-spacing: -2px; text-anchor: middle;
  fill: url(#shine); stroke: #cfb991; stroke-width: 1.4; stroke-opacity: 0;
  animation: draw 3.0s cubic-bezier(.6, 0, .3, 1) both; }
.glow { font-size: 112px; font-weight: 800; letter-spacing: -2px; text-anchor: middle;
  fill: #cfb991; opacity: 0.22; filter: url(#blur); animation: glow 3.0s ease-out both; }
@keyframes draw {
  0% { stroke-dasharray: 420; stroke-dashoffset: 420; stroke-opacity: 1; fill-opacity: 0; }
  73% { stroke-dasharray: 420; stroke-dashoffset: 0; stroke-opacity: 1; fill-opacity: 0; }
  100% { stroke-dasharray: 420; stroke-dashoffset: 0; stroke-opacity: 0; fill-opacity: 1; } }
@keyframes glow { 0%, 73% { opacity: 0; } }
</style>
<defs>
<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1200" y2="0" gradientTransform="translate(-900 0)">
  <stop offset="0" stop-color="#cfb991"/>
  <stop offset="0.42" stop-color="#cfb991"/>
  <stop offset="0.5" stop-color="#fff4d8"/>
  <stop offset="0.58" stop-color="#cfb991"/>
  <stop offset="1" stop-color="#cfb991"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="-900 0;900 0;900 0"
    keyTimes="0;0.320;1" dur="5.0s" begin="2.7s" repeatCount="indefinite"/>
</linearGradient>
<filter id="blur" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
</defs>
<text class="sans glow" x="600.0" y="122">Soumil Bhandari</text>
<text class="sans name" x="600.0" y="122">Soumil Bhandari</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-label="You2: A local-only desk assistant that remembers. It consolidates every conversation into a second brain, and none of it leaves the box.">
<title>You2: A local-only desk assistant that remembers. It consolidates every conversation into a second brain, and none of it leaves the box.</title>
<style>
.sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
